name: Release (macOS)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS bundle
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Install node_modules up front so the icon step inside build_macos.sh
      # (`npx tauri icon`) resolves the local Tauri CLI instead of trying to
      # fetch it from npm on a clean runner.
      - name: Install dependencies
        run: npm ci

      # Reuses the same script used for local macOS builds. It generates icons,
      # builds the Tauri app, packages a .dmg, and writes a .sha256 checksum
      # into dist/.
      - name: Build app and DMG
        run: bash ./build_macos.sh

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ino-agent-mac.dmg
            dist/ino-agent-mac.dmg.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
