[package]
name = "ino-agent"
version = "0.1.0"
description = "ino-agent - Intelligent neural operator agent"
authors = ["ino-agent"]
edition = "2021"

[lib]
name = "ino_agent_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
dirs = "6"
base64 = "0.22"
encoding_rs = "0.8"
pdf-extract = "0.12.0"
