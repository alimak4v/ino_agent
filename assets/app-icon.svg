  <rect x="84" y="72" width="856" height="856" rx="216" fill="url(#shine)"/>

  <g filter="url(#markShadow)">
    <g fill="none" stroke="#122B38" stroke-width="52" stroke-linecap="round" stroke-linejoin="round">
      <path d="M360 380 255 548 190 704"/>
