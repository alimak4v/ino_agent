<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="treeAI app icon">
  <defs>
    <linearGradient id="tile" x1="180" y1="96" x2="844" y2="920" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8FDFA"/>
      <stop offset="1" stop-color="#D8EEFF"/>
    </linearGradient>
    <linearGradient id="shine" x1="200" y1="100" x2="824" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.52"/>
